name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ls -la
          for z in LibraAndroid*.zip; do unzip -oq "$z"; done
          ls -la LibraAndroid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle -p LibraAndroid/LibraAndroid assembleDebug --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: LibraAndroid/LibraAndroid/app/build/outputs/apk/debug/*.apk
