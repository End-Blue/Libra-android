name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          # Busca cualquier zip del proyecto y lo descomprime
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No se encontró ZIP, usando carpeta actual"
          else
            echo "Descomprimiendo $ZIP"
            unzip -q "$ZIP"
          fi
          # Muestra la estructura para debug
          ls -la
          # Encuentra dónde está el gradlew
          GRADLEW=$(find . -name "gradlew" | head -1)
          echo "GRADLEW encontrado en: $GRADLEW"
          PROJ_DIR=$(dirname "$GRADLEW")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x "$PROJ_DIR/gradlew"

      - name: Compilar APK debug
        run: |
          cd "$PROJ_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Libra-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
