name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descomprimir y localizar proyecto
        shell: bash
        run: |
          set -euo pipefail

          # Si el repositorio contiene el ZIP del proyecto, lo descomprime.
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [[ -n "$ZIP" ]]; then
            echo "Descomprimiendo: $ZIP"
            unzip -oq "$ZIP"
          fi

          # Localiza el archivo de configuración raíz de Gradle.
          SETTINGS=$(find . -type f -name 'settings.gradle.kts' \
            -not -path './.git/*' -print -quit)

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: No se encontró settings.gradle.kts. Revisa el ZIP o los archivos del repositorio."
            echo "Contenido del repositorio:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El ZIP Libra v3 no incluye gradlew ni gradle/wrapper.
      # Por eso instalamos Gradle 8.9 directamente y ejecutamos 'gradle'.
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Libra-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
          
